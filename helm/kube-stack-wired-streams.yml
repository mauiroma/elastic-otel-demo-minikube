# Routes all EDOT logs to the logs.otel wired stream.
# Use "logs" instead of "logs.otel" on Elastic Stack 9.2-9.3.
collectors:
  gateway:
    config:
      processors:
        transform/logs-streams:
          error_mode: ignore
          log_statements:
            - context: resource
              statements:
                - set(attributes["elasticsearch.index"], "logs.otel")
      service:
        pipelines:
          logs:
            receivers: [otlp]
            processors: [transform/logs-streams]
            exporters: [debug, otlp/ingest_logs]